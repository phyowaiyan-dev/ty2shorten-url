<VirtualHost *:80>
    ServerName app.Phyo Wai Yan.com

    ProxyPreserveHost On
    ProxyRequests Off

    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-Host "app.Phyo Wai Yan.com"
    RequestHeader set X-Forwarded-Port "80"

    ProxyPass / http://127.0.0.1:8722/
    ProxyPassReverse / http://127.0.0.1:8722/

    ErrorLog ${APACHE_LOG_DIR}/ty2shorten-error.log
    CustomLog ${APACHE_LOG_DIR}/ty2shorten-access.log combined
</VirtualHost>

# Enable required modules:
#   sudo a2enmod proxy proxy_http headers ssl rewrite
#
# After TLS is issued, ensure the Certbot-created SSL virtual host forwards:
#   RequestHeader set X-Forwarded-Proto "https"
#   RequestHeader set X-Forwarded-Port "443"
#
# Suggested Certbot command:
#   sudo certbot --apache -d app.Phyo Wai Yan.com
