name: Feature request
description: Suggest a focused enhancement.
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - Small
        - Medium
        - Large
        - Unsure
  - type: dropdown
    id: breaking
    attributes:
      label: Breaking-change risk
      options:
        - None expected
        - Possible
        - Likely
        - Unsure
  - type: textarea
    id: context
    attributes:
      label: Additional context
